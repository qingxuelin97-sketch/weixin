name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  screenshot:
    name: golden screenshots (non-blocking until goldens regenerated in CI)
    runs-on: ubuntu-latest
    # Goldens are committed from a dev container; CI CJK font may differ, so this
    # is advisory until the baselines are regenerated inside this exact runner
    # (run `pnpm test:screenshot:update` here and commit). Until then it never
    # blocks a merge — its value is the uploaded diff report.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Same CJK font as the calibration baseline so CI pixels ≈ device pixels.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:screenshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
