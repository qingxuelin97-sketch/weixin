name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Manual entry point for `regen-goldens` (M-I11). Baselines are minted by CI,
  # never by a dev container — see that job for why.
  workflow_dispatch:

jobs:
  check:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Build in CI too (M-I18). Until now only the screenshot job built, so a
      # broken production build could reach the branch while `check` stayed
      # green — and nothing measured startup weight at all.
      - run: pnpm build
      - run: pnpm check:size

  # android/ 是手写 Kotlin（M-I10），但 `check` 全程碰不到它——本容器构不了 android
  # （dl.google.com 被出网策略拦），所以 Kotlin 编译错误只会在 release.yml 手动出包时
  # 才炸，离引入它的提交已隔了不知多少轮。这个 job 把「Kotlin 能编译、Manifest 能合并」
  # 提前到每次触碰 android/** 的 push / PR 上（M-J0）。
  #
  # 为什么不用 workflow 级 `on.paths`：ci.yml 的 push/pull_request 触发器是全部 job 共享
  # 的，在触发器上加 paths 会把 typecheck/lint/test 一起过滤掉。GitHub 没有 job 级
  # paths 过滤，所以这里自己 diff——判不出基点时**宁跑勿漏**（fail open）。
  android-changes:
    name: android/** touched?
    runs-on: ubuntu-latest
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史才能 diff 到 push 前的基点
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          # 基点不可知（新分支的 before 是全零、force-push 后旧提交可能已不可达、
          # 手动 dispatch 没有基点）→ 当作动过，跑一次编译顶多浪费几分钟；
          # 漏掉一次则坏 Kotlin 静静躺到下次出包。
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base" 2>/dev/null; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "::notice::diff 基点不可知，按已触碰 android/ 处理（fail open）"
          elif git diff --name-only "$base" HEAD | grep -q '^android/'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  android-compile:
    name: android compileDebugKotlin
    needs: android-changes
    if: needs.android-changes.outputs.touched == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # JDK 21，不是 runner 默认的 17：capacitor-android 7.6.x 以
      # `sourceCompatibility 21` 编译，17 会在 Gradle 走到那个模块时（约 100 秒后）
      # 才报 "invalid source release: 21"。与 release.yml 同一坑、同一 pin。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Gradle 侧引用 node_modules 里的 capacitor-android 与各插件工程，先装依赖。
      - run: pnpm install --frozen-lockfile
      # `cap update` 生成未入库的 capacitor.settings.gradle / capacitor.build.gradle
      # （settings.gradle 第一行就 apply 它们，裸 checkout 连 configure 都过不去）。
      # 不用 `cap sync`：sync 里的 copy 需要真的 `pnpm build` 出 dist/——编 Kotlin 和
      # 合并 Manifest 都用不上 Web 产物，省下整次前端构建。但 cap 7 即使 update 也
      # 校验 webDir 存在并往 assets/ 写 plugins.json（两处都在 .gitignore 里），
      # 所以先给两个空壳目录。此流程已在容器里实测跑通（cap update 本身不碰
      # dl.google.com，被拦的只是后面的 gradle 步）。
      - run: |
          mkdir -p dist android/app/src/main/assets
          touch dist/index.html
          npx cap update android
      # 不 assembleDebug（还要打 dex、打包资源，贵一个数量级）：
      # compileDebugKotlin 抓 Kotlin 编译错误，processDebugManifest 抓 Manifest 合并
      # 冲突——这两类正是改 android/** 时最容易带进来的破绽。
      - run: cd android && ./gradlew --no-daemon compileDebugKotlin processDebugManifest

  screenshot:
    name: golden screenshots
    runs-on: ubuntu-latest
    # Skipped whenever this run exists to REGENERATE baselines — checking them
    # first would only report the diff regen is about to erase. Two ways in:
    # a manual dispatch, or a commit whose message carries [regen-goldens].
    if: >-
      github.event_name != 'workflow_dispatch' &&
      !contains(github.event.head_commit.message, '[regen-goldens]')
    # BLOCKING since M-I11.
    #
    # The baselines are minted BY THIS JOB (see the `regen-goldens` job below),
    # never by a dev container. Two things differ between the two environments
    # and both move glyph pixels: the CJK font package, and the Chromium build —
    # playwright.config.ts points local runs at whatever PLAYWRIGHT_BROWSERS_PATH
    # provides, while this job installs Playwright's own pinned build. Matching
    # the font alone still left 30/52 shots red, which is what proved the browser
    # is the other half of it.
    #
    # So: to update goldens after an intentional UI change, run the
    # `regen-goldens` job (workflow_dispatch) on your branch and let it commit
    # the PNGs back. Do not commit locally-generated baselines.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Same CJK font as the calibration baseline so CI pixels ≈ device pixels.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:screenshot
      # `test-results/` holds the actual/diff PNGs — the only way to SEE why a
      # shot moved. The html report is emitted alongside the github reporter
      # (playwright.config.ts) precisely so this upload is not empty, which it
      # silently was until M-I11.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  regen-goldens:
    name: regenerate goldens (manual)
    # Two entry points, both explicit:
    #   - workflow_dispatch (the original), and
    #   - a push whose HEAD commit message contains [regen-goldens].
    #
    # The marker exists because dispatch needs a token permission this repo's
    # automation does not always hold (M-I18: `actions: write` came back 403
    # mid-round, leaving a stale baseline with no way to remint it). A marker
    # in a commit message needs nothing but the push that is happening anyway.
    #
    # It cannot loop, though not for the reason first written here: GitHub fires
    # NO workflow at all for a push made with GITHUB_TOKEN, so this job's own
    # commit triggers nothing — not this job, and not the screenshot gate either.
    # (The marker-free commit message is a second belt, not the load-bearing one.)
    # The consequence to remember: baselines committed here are NEVER re-checked
    # by the gate; their only verification is the two-pass self-check below. To
    # have the gate actually run against them, push one more commit on top — an
    # ordinary push does trigger workflows.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[regen-goldens]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:screenshot:update
      # Twice: a baseline that is not reproducible in its OWN environment is a
      # flake generator, and committing it would hand the gate a shot that goes
      # red at random. The second pass must be clean against what pass one wrote.
      - run: pnpm test:screenshot
      - name: commit refreshed baselines
        run: |
          git config user.name 'qingxuelin97-sketch'
          git config user.email 'mesakurax@gmail.com'
          git add tests/screenshot
          if git diff --cached --quiet; then
            echo 'goldens already current — nothing to commit'
          else
            git commit -m 'chore(ci): 在 CI 环境重生成 golden 基线'
            git push origin HEAD:${{ github.ref_name }}
          fi
