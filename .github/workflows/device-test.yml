# The device loop (M-E). The real-device bug survived several rounds because
# every symptom traveled through a human as a one-line report — debugging over a
# telephone. This workflow removes the human from the loop: build the SAME APK a
# phone gets, boot an Android emulator (GitHub's Linux runners expose KVM),
# install it, let the app run its own transport self-test, and read the verdict
# out of logcat. The agent triggers this and reads the logs itself.
#
# The self-test is keyless: probing each provider origin with a bogus bearer
# token cannot succeed as an API call, but ANY HTTP status coming back (401,
# 404…) proves DNS+TLS+HTTP(+CORS for the WebView channel) worked end to end.
# Only "failed to fetch"/timeout means the transport is broken. So no secrets
# are needed here, ever.
name: Device test (emulator)

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可选）'
        required: false
  push:
    branches: ['claude/**']
    # Only the workflow file itself: the first push (which adds it) starts run
    # #1 automatically; later runs are dispatched on demand. Building 15 min of
    # emulator on every src/ push would burn minutes for nothing.
    paths: ['.github/workflows/device-test.yml']

jobs:
  emulator:
    name: run APK on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # +5 for the M-I10 native-surface assertions
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # JDK 21, not 17 — capacitor-android 7.6.x needs it (see release.yml).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Build web bundle
        run: pnpm build

      # android/ is committed since M-I10 (hand-written Kotlin inside);
      # `cap add` would clobber it with the template — sync only.
      - name: Sync into the committed native project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      # Without this, /dev/kvm is root-only and the emulator falls back to
      # software emulation — which on x86_64 system images means it effectively
      # never boots inside the job timeout.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install, run, read the device's own report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 33: modern-enough System WebView (the app's JS targets modern
          # Chrome), still the battle-tested CI image generation.
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # NOTE: emulator-runner executes this with /usr/bin/sh (dash), not
          # bash — `set -o pipefail` is an "Illegal option" there and killed
          # run #1 before the install. POSIX flags only. The one pipeline below
          # (grep|tail|tee) is allowed to "succeed" empty: the Verdict step
          # checks the FILE, which is the honest signal anyway.
          script: |
            set -eux
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb shell am start -n com.personal.weixinai/.MainActivity
            # Self-test arms ~2.5s after mount and probes 3 endpoints × 2
            # channels with 10s deadlines; 75s covers the worst case plus boot.
            sleep 75
            adb exec-out screencap -p > screen.png || true
            adb logcat -d > logcat.txt
            # The one line the whole loop exists to obtain.
            grep -a 'AIWX-SELFTEST' logcat.txt | tail -1 | tee selftest-line.txt
            # Fatal WebView/native crashes would explain "nothing happens" —
            # surface them in the job log either way.
            grep -aE 'FATAL EXCEPTION|AndroidRuntime.*FATAL|E Capacitor' logcat.txt | head -20 || true

            # ---- M-I10 native surface assertions --------------------------
            # In a FILE, not inline: this action runs `script:` one line per
            # `sh -c`, so variables and functions do not survive between lines —
            # the inline version died on `: > "$NA"` with an empty $NA and the
            # assertions never ran once. See scripts/device-native-asserts.sh.
            sh scripts/device-native-asserts.sh

      - name: Verdict
        run: |
          set -euo pipefail
          if [ ! -s selftest-line.txt ]; then
            echo "::error::设备没有产出自检行——应用可能白屏或崩溃，看 logcat 工件"
            exit 1
          fi
          # Strip the logcat prefix down to the JSON payload after the tag.
          # Console lines can be truncated or wrapped by logcat; jq failing to
          # parse IS a finding (report it, don't mask it).
          JSON=$(sed -n 's/.*AIWX-SELFTEST //p' selftest-line.txt)
          echo "$JSON" | jq . || { echo "::error::自检行不是合法 JSON（可能被 logcat 截断）"; exit 1; }
          {
            echo '### 设备自检矩阵'
            echo '```'
            echo "$JSON" | jq -r '.results | to_entries[] |
              "\(.key): fetch=\(.value.webFetch.status // .value.webFetch.error) bridge=\(.value.bridge.status // .value.bridge.error)"'
            echo '```'
            echo ''
            echo "- platform: \`$(echo "$JSON" | jq -r .platform)\` · origin: \`$(echo "$JSON" | jq -r .origin)\` · online: \`$(echo "$JSON" | jq -r .online)\`"
            echo "- 判定：任何 HTTP 状态码（含 401/404）= 传输通；只有 failed to fetch / timeout 才是断"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$JSON" | jq -r '.results | to_entries[] |
            "\(.key): fetch=\(.value.webFetch.status // .value.webFetch.error) bridge=\(.value.bridge.status // .value.bridge.error)"'
          # Tell "the runner has no DNS" apart from "the app's transport broke".
          # Run #7 resolved every host (401/401/200); run #8, same code, resolved
          # NONE of them — every bridge error was `Unable to resolve host`. That
          # is the runner's resolver, and failing the job on it teaches everyone
          # to ignore a red device-test, which is how M-I10's assertions went
          # unread for eight runs.
          #
          # The gate keeps its teeth: only a bridge error that is a DNS-resolution
          # failure ON EVERY endpoint counts as infra. One endpoint resolving is
          # proof DNS works, so anything still failing is the app — and the
          # regression this test exists for (the Capacitor plugin-proxy transport
          # bug) never presents as a resolver failure.
          DNS_DEAD=$(echo "$JSON" | jq -r '
            [ .results[] | .bridge.error // "" ] as $e
            | if ($e | length) > 0
                 and ($e | all(test("Unable to resolve host|No address associated with hostname|UnknownHostException")))
              then "yes" else "no" end')
          if [ "$DNS_DEAD" = yes ]; then
            echo "::warning::runner 无 DNS（每个端点的原生通道都是解析失败）——这是环境问题不是 App 问题，连通性判定跳过；原生面断言照常执行"
            echo '- ⚠️ 本次 runner 无 DNS，连通性判定已跳过（原生面断言不受影响）' >> "$GITHUB_STEP_SUMMARY"
          else
            # The assertion: every endpoint reachable via at least one channel.
            echo "$JSON" | jq -e '.allReachable == true' > /dev/null \
              || { echo "::error::有端点两条通道都不通——这就是真机症状的复现点"; exit 1; }
          fi

      # M-I10: turn the emulator's native-surface checks into a verdict.
      # WHAT THE EMULATOR CANNOT PROVE (real-device checklist, specs/native-android.md):
      #  - the OEM overlay-permission FLOW (appops here ≠ MIUI/ColorOS consent UI)
      #  - full-screen intent behaviour on a LOCKED screen with vendor lockscreens
      #  - typing into the real RemoteInput keyboard (synthetic enqueue here)
      #  - widget on an actual launcher (no launcher host in the headless image)
      #  - vendor battery-whitelist deep links (emulator has no OEM security apps)
      - name: Native surfaces verdict (M-I10)
        # `always()` because this and the connectivity verdict are INDEPENDENT
        # checks. Without it, one flaky-network run skips this step entirely and
        # a real native-surface regression ships unnoticed — which is exactly
        # what happened on run #8: all 11 assertions had passed, and the job
        # still reported failure with this step greyed out.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s native-asserts.txt ]; then
            echo "::error::原生断言没有产出结果文件——emulator script 可能在此前就失败了"
            exit 1
          fi
          {
            echo '### M-I10 原生面断言'
            echo '```'
            cat native-asserts.txt
            echo '```'
            echo '- WARN 项在无头模拟器上属预期（dumpsys 脱敏/无 launcher）；只有 FAIL 才红'
            echo '- 真机才能验的项见 specs/native-android.md「真机验收清单」'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^FAIL' native-asserts.txt; then
            echo "::error::有原生断言失败："
            grep '^FAIL' native-asserts.txt
            exit 1
          fi
          echo "全部硬断言通过"

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-evidence-${{ github.run_number }}
          path: |
            logcat.txt
            logcat-native.txt
            notif-dump.txt
            notif-dump2.txt
            window-dump.txt
            native-asserts.txt
            screen.png
            selftest-line.txt
          retention-days: 14
          if-no-files-found: warn
