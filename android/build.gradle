// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        // AIWX (M-I10): the hand-written native layer (bubble overlay,
        // RemoteInput reply, call notification, widget) is Kotlin.
        // 1.9.25 is the last 1.9.x and supports jvmTarget 21, matching the
        // JavaVersion.VERSION_21 that capacitor.build.gradle pins.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
